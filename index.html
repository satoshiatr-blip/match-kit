<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060a">
<link rel="icon" href="icon-hub.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MATCH KIT — 少年サッカー サポートアプリ集</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#05060a;
  color:#eef2fb;
  font-family:'Noto Sans JP',sans-serif;
  max-width:520px;
  margin:0 auto;
  min-height:100svh;
}
.hero{
  padding:64px 20px 40px;
  text-align:center;
  background:
    radial-gradient(circle at 20% 0%, rgba(62,224,255,0.10) 0%, transparent 45%),
    radial-gradient(circle at 80% 10%, rgba(225,59,255,0.10) 0%, transparent 45%),
    radial-gradient(circle at 50% 30%, rgba(0,212,255,0.06) 0%, transparent 55%);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.hero-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:3px;
  color:#9aa8c4;
  border:1px solid rgba(255,255,255,0.14);
  padding:6px 14px;border-radius:100px;
  margin-bottom:22px;
  text-transform:uppercase;
}
.hero-h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:64px;letter-spacing:4px;line-height:0.95;
  margin-bottom:16px;
}
.hero-h1 em{
  font-style:normal;
  background:linear-gradient(90deg,#3ee0ff,#e13bff 55%,#f5c518);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-desc{
  font-size:13px;color:rgba(238,242,251,0.55);line-height:1.8;
  max-width:340px;margin:0 auto;
}
.strip{
  height:3px;
  background:linear-gradient(90deg,#3ee0ff,#e13bff,#ff8a3d,#baff2e,#f5c518);
}
.apps{
  padding:28px 16px 20px;
  display:flex;flex-direction:column;gap:12px;
}
.card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.08);
  border-left:3px solid var(--c);
  border-radius:14px;
  text-decoration:none;color:inherit;
  transition:background 0.15s ease, transform 0.15s ease;
}
.card:active{background:rgba(255,255,255,0.06);transform:scale(0.985);}
.card img{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
}
.card .body{flex:1;min-width:0;}
.card .name{
  font-weight:900;font-size:15px;letter-spacing:0.3px;
  color:var(--c);
}
/* GOLAZO：アイコンのネオン配色。文字の幅だけにグラデーションをかける */
.card .name.neon{
  display:inline-block;
  background:linear-gradient(110deg,#22d3ee,#818cf8 35%,#e879f9 65%,#ffb627);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.card.neon-card{position:relative;}
.card.neon-card::before{
  content:"";position:absolute;left:-3px;top:-1px;right:-1px;bottom:-1px;
  border-radius:14px;border-left:3px solid transparent;pointer-events:none;
  background:linear-gradient(180deg,#22d3ee,#a855f7 50%,#ff8a3d) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);
}
.card .desc{
  font-size:11.5px;color:rgba(238,242,251,0.5);
  margin-top:2px;line-height:1.5;
}
.card .arrow{
  font-size:20px;color:rgba(238,242,251,0.25);flex-shrink:0;
}
footer{
  padding:36px 20px 48px;text-align:center;
}
.chips{
  display:grid;grid-template-columns:auto auto;gap:1px;
  width:max-content;max-width:100%;margin:0 auto 18px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;overflow:hidden;
}
/* 各列の中で左寄せにして、チェックマークを縦にそろえる */
.chip{
  display:flex;align-items:center;gap:6px;
  padding:9px 16px;background:#05060a;
  /* 文字はアプリ一覧の説明文と同じ色・太さ */
  font-size:11px;font-weight:400;letter-spacing:0.3px;
  color:rgba(238,242,251,0.5);
}
.chip i{
  font-style:normal;font-size:12px;
  background:linear-gradient(110deg,#22d3ee,#e879f9 60%,#ffb627);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.foot-note{font-size:10.5px;color:rgba(238,242,251,0.3);line-height:1.8;}
/* 日本語を単語の途中で折らない（改行は助詞・読点の後ろだけ。印はページ末尾のスクリプトで付ける） */
body{word-break:keep-all;overflow-wrap:anywhere;line-break:strict;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-tag">少年サッカー サポートアプリ集</div>
  <div class="hero-h1">MATCH<em>KIT</em></div>
  <p class="hero-desc">動画編集・フォームチェック・作戦ボード。<br>iPhoneで無料で使える5つのツール。</p>
</div>
<div class="strip"></div>

<div class="apps">

  <a class="card" style="--c:#3ee0ff" href="https://satoshiatr-blip.github.io/matchcut/promo.html">
    <img src="icon-matchcut.png" alt="">
    <div class="body">
      <div class="name">MATCHCUT</div>
      <div class="desc">試合動画をハイライトに編集</div>
    </div>
    <span class="arrow">&#8250;</span>
  </a>

  <a class="card" style="--c:#e13bff" href="https://satoshiatr-blip.github.io/matchcut-ai/promo.html">
    <img src="icon-matchcutplus.png" alt="">
    <div class="body">
      <div class="name">MATCHCUT+</div>
      <div class="desc">AI名場面検出つき・成長の記録も</div>
    </div>
    <span class="arrow">&#8250;</span>
  </a>

  <a class="card neon-card" style="--c:transparent" href="https://satoshiatr-blip.github.io/golazo/promo.html">
    <img src="icon-golazo.png" alt="">
    <div class="body">
      <div class="name neon">GOLAZO</div>
      <div class="desc">一瞬の見せ場を、特別な一本に</div>
    </div>
    <span class="arrow">&#8250;</span>
  </a>

  <a class="card" style="--c:#baff2e" href="https://satoshiatr-blip.github.io/form-check/promo.html">
    <img src="icon-formcheck.png" alt="">
    <div class="body">
      <div class="name">FORM CHECK</div>
      <div class="desc">2つの動画を並べてフォーム比較</div>
    </div>
    <span class="arrow">&#8250;</span>
  </a>

  <a class="card" style="--c:#f5c518" href="https://satoshiatr-blip.github.io/soccer-tactics/promo.html">
    <img src="icon-tactics.png" alt="">
    <div class="body">
      <div class="name">TACTICS BOARD</div>
      <div class="desc">フリーハンドで作戦を描いて共有</div>
    </div>
    <span class="arrow">&#8250;</span>
  </a>

</div>

<footer>
  <div class="chips">
    <span class="chip"><i>&#10003;</i>全て無料</span>
    <span class="chip"><i>&#10003;</i>インストール不要</span>
    <span class="chip"><i>&#10003;</i>iPhone対応</span>
    <span class="chip"><i>&#10003;</i>データは端末内のみ</span>
  </div>
  <p class="foot-note">気になるアプリをタップすると、それぞれの紹介ページに移動します。</p>
</footer>

<script>
// 助詞・読点の後ろに改行できる印（ゼロ幅スペース）を入れる。続く文字がひらがなのとき（「できます」の「で」など）と「その」「この」の後ろには入れない
(function(){
  var re=/((?:[はがをにでともへや、。」）]|(?<![そこあど])の))(?=[^ぁ-ゟ、。」）！？!?\s])/g;
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n;
  while((n=w.nextNode())){ if(/[぀-鿿]/.test(n.data)&&!/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) n.data=n.data.replace(re,'$1​'); }
})();
</script>
</body>
</html>
